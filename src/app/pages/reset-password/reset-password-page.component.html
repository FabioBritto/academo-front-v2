<main>
  <section id="activate" class="activate-section">
    <div class="container">
      <div class="activate-logo">
        <img src="assets/images/academo/academo-logo.png" alt="Academo" class="img-fluid">
      </div>

      <div class="reset-password-form" *ngIf="status !== 'success'">
        <app-form-card
          [formGroup]="form"
          title="Redefinir senha"
          subtitle="Digite sua nova senha e confirme para concluir."
          icon="bi bi-shield-lock-fill"
          submitLabel="Redefinir senha"
          submitIcon="bi bi-arrow-right-circle-fill"
          secureNote="Sua senha é armazenada de forma segura"
          (formSubmit)="submit()"
        >
          <div class="row g-4">
            <div class="col-12">
              <app-input-group
                label="Nova senha"
                icon="bi bi-key"
                placeholder="Digite a nova senha"
                type="password"
                [showPasswordToggle]="true"
                [invalid]="(form.get('newPassword')?.touched || form.touched) && !!form.get('newPassword')?.invalid"
                formControlName="newPassword"
              ></app-input-group>
            </div>

            <div class="col-12">
              <app-input-group
                label="Confirmar nova senha"
                icon="bi bi-key-fill"
                placeholder="Confirme a nova senha"
                type="password"
                [showPasswordToggle]="true"
                [invalid]="(form.get('confirmNewPassword')?.touched || form.touched) && (!!form.get('confirmNewPassword')?.invalid || passwordMismatch)"
                formControlName="confirmNewPassword"
              ></app-input-group>
            </div>

            <div class="col-12" *ngIf="passwordMismatch && (form.get('confirmNewPassword')?.touched || form.touched)">
              <div class="alert alert-danger mb-0">As senhas não conferem.</div>
            </div>

            <div class="col-12" *ngIf="message && status === 'error'">
              <div class="alert alert-danger mb-0">{{ message }}</div>
            </div>

            <div class="col-12" *ngIf="!isTokenValid">
              <div class="alert alert-danger mb-0">Token de redefinição inválido.</div>
            </div>
          </div>
        </app-form-card>
      </div>

      <div class="activate-message" *ngIf="status === 'success'">
        {{ message }}
      </div>
    </div>
  </section>
</main>
