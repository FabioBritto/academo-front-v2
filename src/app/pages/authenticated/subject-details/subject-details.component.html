<div class="subject-details">
  <div class="subject-details__breadcrumb">
    <a class="subject-details__breadcrumb-link" [routerLink]="['/app/materias']">Matérias</a>
    <span class="subject-details__breadcrumb-sep">&gt;</span>
    <span>{{ breadcrumbLabel }}</span>
  </div>

  <section class="subject-details__header">
    <div class="subject-details__header-main">
      <h2 class="subject-details__title" [attr.title]="subject?.name || null">{{ displayName }}</h2>
      <p class="subject-details__description">{{ subject?.description }}</p>

      <div class="subject-details__meta">
        <div class="subject-details__meta-item">
          <span class="subject-details__meta-label">Tipo de cálculo:</span>
          <ng-container *ngIf="subject?.calculationType === 'MEDIA_PONDERADA'; else calculationTypeText">
            <span class="subject-details__meta-value subject-details__meta-value--action">
              <app-submit-button
                [label]="weightedButtonLabel"
                icon="bi bi-gear"
                type="button"
                (click)="openWeightedAverageConfigModal()"
              ></app-submit-button>
            </span>
          </ng-container>
          <ng-template #calculationTypeText>
            <span class="subject-details__meta-value">{{ calculationTypeLabel }}</span>
          </ng-template>

          <div class="subject-details__meta-item subject-details__meta-item--right">
          <span class="subject-details__meta-label">Nota mínima:</span>
          <span class="subject-details__meta-value">{{ passingGradeDisplay }}</span>
        </div>

        <div class="subject-details__meta-item subject-details__meta-item--right">
          <span class="subject-details__meta-label">Nota Final:</span>
          <span
            class="subject-details__meta-value"
            [ngClass]="{
              'subject-details__meta-value--grade-ok': isPassingGradeDefined && isFinalGradeAboveOrEqualPassing,
              'subject-details__meta-value--grade-bad': isPassingGradeDefined && isFinalGradeBelowPassing
            }"
          >
            {{ finalGradeDisplay }}
          </span>
        </div>
        </div>

        
      </div>
    </div>

    <div class="subject-details__header-actions">
      <app-submit-button
        label="Editar Matéria"
        icon="bi bi-pencil-square"
        type="button"
        (click)="openEditSubjectModal()"
      ></app-submit-button>

      <app-delete-button
        class="mt-2"
        label="Excluir Matéria"
        icon="bi bi-trash-fill"
        [disabled]="isDeleting || !subject"
        [isSubmitting]="isDeleting"
        confirmTitle="Excluir matéria"
        [confirmMessage]="subject ? ('Tem certeza que deseja excluir a matéria ' + subject.name + '?') : ''"
        (confirmed)="onDeleteSubject()"
      ></app-delete-button>
    </div>
  </section>

  <div class="subject-details__content">
    <div class="subject-details__left">
      <div class="subject-details__tabs">
        <app-tabs [value]="periodTab" [options]="periodOptions" (valueChange)="onPeriodTabChange($event)"></app-tabs>
      </div>

      <app-period-details
        [subjectId]="subject?.id ?? null"
        [periodLabel]="periodTab === 'period1' ? '1' : (periodTab === 'period2' ? '2' : 'Exame')"
        [hasItems]="!!selectedPeriod"
        [period]="selectedPeriod"
        [isExam]="periodTab === 'exam'"
        [examDeleteDisabled]="isDeletingExam || !selectedPeriod"
        [examDeleteSubmitting]="isDeletingExam"
        [pageSize]="6"
        [emptyMessage]="periodTab === 'exam' ? '' : 'Nenhuma atividade por enquanto.'"
        (changed)="onActivitiesChanged()"
        (deleteExam)="onDeleteExam()"
      >
        <div class="subject-details__period-summary">
          <div class="subject-details__period-metric" *ngIf="periodTab !== 'exam'">
            <span class="subject-details__period-metric-label">Nota:</span>
            <span class="subject-details__period-metric-value">{{ selectedPeriod?.grade ?? '-' }}</span>
          </div>
          <div
            class="subject-details__period-metric"
            *ngIf="periodTab !== 'exam' && subject?.calculationType !== 'MEDIA_ARITMETICA'"
          >
            <span class="subject-details__period-metric-label">Peso:</span>
            <span class="subject-details__period-metric-value">{{ formatWeightPercent(selectedPeriod?.weight) }}</span>
          </div>
        </div>
      </app-period-details>
    </div>

    <div class="subject-details__right">
      <div class="subject-details__tabs subject-details__tabs--with-action">
        <app-tabs [value]="contentTab" [options]="contentOptions" (valueChange)="onContentTabChange($event)"></app-tabs>

        <app-submit-button
          *ngIf="contentTab === 'flashcards'"
          class="subject-details__study-button"
          label="Estudar"
          icon=""
          type="button"
          (click)="openStudyConfigModal()"
        ></app-submit-button>
      </div>

      <ng-container [ngSwitch]="contentTab">
        <app-subject-flashcard-list
          *ngSwitchCase="'flashcards'"
          [subjectId]="subject?.id || 0"
          emptyMessage="Nenhum flashcard por enquanto."
          (changed)="onFlashcardsChanged()"
        ></app-subject-flashcard-list>
        <app-subject-files-list
          *ngSwitchDefault
          [subjectId]="subject?.id || 0"
          emptyMessage="Nenhum arquivo por enquanto."
          (changed)="onFilesChanged()"
        ></app-subject-files-list>
      </ng-container>
    </div>
  </div>
</div>
