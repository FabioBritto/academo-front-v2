<section class="flashcard-view-card" aria-label="Flashcards">
  <header class="flashcard-view-card__header">
    <div class="flashcard-view-card__header-left">
      <h4>Flashcards</h4>

      <div class="flashcard-view-card__advanced-filters" role="radiogroup" aria-label="Filtro">
        <label class="flashcard-view-card__radio">
          <input
            type="radio"
            name="flashcardsAdvancedFilter"
            [checked]="filterMode === 'all'"
            (change)="onFilterModeChange('all')"
          />
          <span>Todos os Flashcards</span>
        </label>

        <label class="flashcard-view-card__radio">
          <input
            type="radio"
            name="flashcardsAdvancedFilter"
            [checked]="filterMode === 'groups'"
            (change)="onFilterModeChange('groups')"
          />
          <span>Grupos</span>
        </label>

        <label class="flashcard-view-card__radio">
          <input
            type="radio"
            name="flashcardsAdvancedFilter"
            [checked]="filterMode === 'subjects'"
            (change)="onFilterModeChange('subjects')"
          />
          <span>Matérias</span>
        </label>
      </div>

      <ng-container *ngIf="filterMode === 'subjects'">
        <app-advanced-dropdown
          label="Selecionar matéria"
          [items]="subjectOptions"
          [selectedId]="selectedSubjectId"
          [disabled]="isLoadingAdvancedOptions"
          (selected)="onSubjectSelected($event)"
        ></app-advanced-dropdown>
      </ng-container>

      <ng-container *ngIf="filterMode === 'groups'">
        <app-advanced-dropdown
          label="Selecionar grupo"
          [items]="groupOptions"
          [selectedId]="selectedGroupId"
          [disabled]="isLoadingAdvancedOptions"
          (selected)="onGroupSelected($event)"
        ></app-advanced-dropdown>
      </ng-container>
    </div>

    <div class="flashcard-view-card__header-action">
      <app-sort-filters
        class="flashcard-view-card__sort"
        [value]="sort"
        [options]="sortOptions"
        (valueChange)="onSortChange($event)"
      ></app-sort-filters>

      <app-submit-button label="Estudar" icon="bi bi-stack" type="button" (click)="goToStudy()"></app-submit-button>
    </div>
  </header>

  <div class="flashcard-view-card__header-sub">
    Total de Flashcards escolhidos: {{ selectedTotalElements }}
  </div>

  <div class="flashcard-view-card__body">
    <ng-container *ngIf="hasItems; else emptyState">
      <div class="flashcard-view-card__list">
        <app-flashcard-card
          *ngFor="let flashcard of flashcards"
          [flashcard]="flashcard"
          [subjectName]="subjectName(flashcard.subjectId)"
          (selected)="openFlashcardReadonlyModal(flashcard)"
        ></app-flashcard-card>
      </div>

      <app-pagination-controls
        *ngIf="totalPages > 1"
        [page]="page"
        [totalPages]="totalPages"
        [disabled]="isLoadingFlashcards"
        (pageChange)="onPageChange($event)"
      ></app-pagination-controls>
    </ng-container>

    <ng-template #emptyState>
      <p class="flashcard-view-card__empty">{{ emptyMessage }}</p>
    </ng-template>
  </div>
</section>
