<div class="modal-header">
  <h3 class="group-details-modal__name" [attr.title]="group?.name || null">{{ displayName || 'Grupo' }}</h3>

  <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
</div>

<div class="modal-body">
  <div *ngIf="isLoading" class="group-details-modal__loading">
    Carregando...
  </div>

  <ng-container *ngIf="!isLoading">
    <ng-container *ngIf="group; else errorState">
      <div class="group-details-modal__header">
        <div class="group-details-modal__info">
          <div class="group-details-modal__description-field">
            <app-input-group
              [textarea]="true"
              [rows]="6"
              [readOnly]="true"
              [ngModel]="group.description"
              [ngModelOptions]="{ standalone: true }"
              [name]="'groupDescription'"
            ></app-input-group>
          </div>
        </div>

        <div class="group-details-modal__actions">
          <app-submit-button
            type="button"
            label="Editar"
            icon="bi bi-pencil-fill"
            (click)="onEdit()"
          ></app-submit-button>

          <app-submit-button
            type="button"
            label="Adicionar Matéria(s)"
            icon="bi bi-plus-circle-fill"
            (click)="onAddSubjects()"
          ></app-submit-button>

          <app-delete-button
            label="Excluir"
            icon="bi bi-trash-fill"
            [disabled]="isDeleting"
            [isSubmitting]="isDeleting"
            confirmTitle="Excluir grupo"
            [confirmMessage]="'Tem certeza que deseja excluir o grupo ' + group.name + '?'"
            (confirmed)="onDelete()"
          ></app-delete-button>

        </div>
      </div>

      <div class="group-details-modal__subjects">
        <h5 class="group-details-modal__subjects-title">Lista de matérias</h5>

        <ng-container *ngIf="group.subjects.length > 0; else emptySubjects">
          <div class="group-details-modal__subjects-list" role="list">
            <article class="group-details-modal__subjects-item" *ngFor="let s of group.subjects" role="listitem">
              <div class="group-details-modal__subjects-item-main">
                <div class="group-details-modal__subjects-item-name">
                  {{ s.name.length > 60 ? ((s.name | slice: 0:57) + '...') : s.name }}
                </div>
                <div class="group-details-modal__subjects-item-meta">
                  <span class="group-details-modal__subjects-item-grade-label">Nota Final:</span>
                  <strong
                    class="group-details-modal__subjects-item-grade-value"
                    [ngClass]="{
                      'group-details-modal__subjects-item-grade-value--grade-ok':
                        isPassingGradeDefined(s) && isFinalGradeAboveOrEqualPassing(s),
                      'group-details-modal__subjects-item-grade-value--grade-bad':
                        isPassingGradeDefined(s) && isFinalGradeBelowPassing(s)
                    }"
                  >
                    {{ s.finalGrade | number: '1.2-2': 'pt-BR' }}
                  </strong>
                </div>
              </div>

              <div class="group-details-modal__subjects-item-actions">
                <app-submit-button
                  type="button"
                  label="Acessar Matéria"
                  icon="bi bi-box-arrow-up-right"
                  [disabled]="isRemovingSubject"
                  (click)="accessSubject(s.id)"
                ></app-submit-button>

                <app-delete-button
                  label="Remover Matéria"
                  icon="bi bi-x-circle-fill"
                  [disabled]="isRemovingSubject"
                  [isSubmitting]="isRemovingSubject"
                  confirmTitle="Remover matéria"
                  [confirmMessage]="'Tem certeza que deseja remover a matéria ' + s.name + ' do grupo?'"
                  (confirmed)="removeSubject(s.id)"
                ></app-delete-button>
              </div>
            </article>
          </div>
        </ng-container>

        <ng-template #emptySubjects>
          <p class="group-details-modal__subjects-empty">Nenhuma matéria neste grupo.</p>
        </ng-template>
      </div>
    </ng-container>

    <ng-template #errorState>
      <div class="alert alert-danger" role="alert">
        Não foi possível carregar os detalhes do grupo.
      </div>
    </ng-template>
  </ng-container>
</div>
