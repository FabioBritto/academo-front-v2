<section class="payment-history-card" aria-label="Histórico de Pagamentos">
  <header class="payment-history-card__header">
    <h4>Histórico de Pagamentos</h4>
  </header>

  <div class="payment-history-card__body">
    <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
      {{ errorMessage }}
    </div>

    <div *ngIf="isLoading" class="text-muted">Carregando...</div>

    <p *ngIf="!isLoading && !errorMessage && !items.length" class="payment-history-card__empty">
      {{ emptyMessage }}
    </p>

    <div *ngIf="!isLoading && !errorMessage && items.length" class="payment-history-card__list">
      <article class="payment-history-card__item" *ngFor="let item of items">
        <div class="payment-history-card__item-top">
          <div class="payment-history-card__item-title">
            <div class="payment-history-card__plan">{{ planLabel(item.planType) }}</div>
            <div class="payment-history-card__value">{{ formatBrl(item.value) }}</div>
          </div>

          <div class="payment-history-card__status" [attr.data-status]="item.paymentStatus">
            {{ statusLabel(item.paymentStatus) }}
          </div>
        </div>

        <div class="payment-history-card__item-meta">
          <div class="payment-history-card__meta">
            <div class="payment-history-card__meta-label">Link gerado em</div>
            <div class="payment-history-card__meta-value">{{ formatDateTime(item.createdAt) }}</div>
          </div>

          <div class="payment-history-card__meta">
            <div class="payment-history-card__meta-label">Vencimento</div>
            <div class="payment-history-card__meta-value">{{ formatDate(item.planDueDate) }}</div>
          </div>

          <div class="payment-history-card__meta payment-history-card__meta--action">
            <app-submit-button
              *ngIf="item.paymentStatus !== 'PAID' && item.url"
              type="button"
              label="Abrir"
              icon=""
              (click)="openUrl(item.url)"
            ></app-submit-button>
          </div>
        </div>
      </article>
    </div>

    <app-pagination-controls
      *ngIf="!isLoading && !errorMessage && totalPages > 1"
      [page]="pageIndex"
      [totalPages]="totalPages"
      [disabled]="isLoading"
      (pageChange)="onPageChange($event)"
    ></app-pagination-controls>
  </div>
</section>
