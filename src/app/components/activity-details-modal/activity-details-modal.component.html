<div class="modal-header">
  <h5 class="modal-title">{{ activity.subjectName }} - {{ activity.name }}</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss('close')"></button>
</div>

<div class="modal-body">
  <div class="d-grid gap-2">
    <div>
      <div class="label">Data</div>
      <div class="value">{{ formattedDate }}</div>
    </div>

    <div>
      <div class="label">Tipo</div>
      <div class="value">{{ activity.activityTypeName }}</div>
    </div>

    <div>
      <div class="label">Nota</div>
      <div class="value">{{ activity.grade }}</div>
    </div>

    <div *ngIf="activity.description">
      <div class="label">Descrição</div>
      <div class="value pre">{{ activity.description }}</div>
    </div>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.close('ok')">Fechar</button>
</div>
