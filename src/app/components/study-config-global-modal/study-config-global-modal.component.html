<div class="modal-header">
  <h5 class="modal-title">Escolha como deseja estudar</h5>

  <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
</div>

<div class="modal-body">
  <div class="study-config-modal">
    <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
      {{ errorMessage }}
    </div>

    <div *ngIf="isLoading" class="study-config-modal__loading">Carregando...</div>

    <div class="study-config-modal__body">
      <button
        *ngFor="let option of levelOptions"
        type="button"
        class="study-config-modal__option aa-difficulty-btn"
        [ngClass]="[
          option.style === 'easy' ? 'aa-difficulty-btn--easy' : '',
          option.style === 'medium' ? 'aa-difficulty-btn--medium' : '',
          option.style === 'hard' ? 'aa-difficulty-btn--hard' : '',
          option.style === 'very-hard' ? 'aa-difficulty-btn--very-hard' : '',
          selectedLevel === option.value ? 'aa-difficulty-btn--active' : ''
        ]"
        [class.study-config-modal__option--active]="selectedLevel === option.value"
        [disabled]="isOptionDisabled(option)"
        [attr.data-style]="option.style"
        (click)="selectLevel(option.value)"
      >
        {{ getOptionLabel(option) }}
      </button>
    </div>

    <div class="modal-actions mt-4" appEqualizeModalButtons>
      <app-submit-button type="button" label="Cancelar" icon="" (click)="cancel()"></app-submit-button>

      <app-submit-button
        type="button"
        label="Iniciar Estudo"
        icon="bi bi-stack"
        [disabled]="isLoading || totalCount === 0"
        (click)="start()"
      ></app-submit-button>
    </div>
  </div>
</div>
