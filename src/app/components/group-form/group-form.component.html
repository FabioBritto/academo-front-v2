<div *ngIf="validationMessage" class="alert alert-warning" role="alert">
  {{ validationMessage }}
</div>

<div *ngIf="errorMessage" class="alert alert-danger" role="alert">
  {{ errorMessage }}
</div>

<form [formGroup]="form" (ngSubmit)="$event.preventDefault(); submit()">
  <div class="row g-4">
    <div class="col-12">
      <app-input-group
        label="Nome"
        icon="bi bi-collection"
        placeholder="Nome do grupo"
        [invalid]="!!(form.get('name')?.touched && form.get('name')?.invalid)"
        formControlName="name"
      ></app-input-group>

      <div class="d-flex justify-content-between align-items-center">
        <small class="text-danger" *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')">
          O nome é obrigatório
        </small>

        <small class="text-danger" *ngIf="form.get('name')?.touched && form.get('name')?.hasError('maxlength')">
          Máximo de 255 caracteres
        </small>

        <small
          class="ms-auto"
          [class.text-danger]="nameLength > maxTextLen"
          [class.text-muted]="nameLength <= maxTextLen"
        >
          {{ nameLength }}/{{ maxTextLen }}
        </small>
      </div>
    </div>

    <div class="col-12">
      <app-input-group
        label="Descrição"
        icon="bi bi-card-text"
        placeholder="Descrição do grupo (opcional)"
        [textarea]="true"
        [rows]="6"
        [invalid]="!!(form.get('description')?.touched && form.get('description')?.invalid)"
        formControlName="description"
      ></app-input-group>

      <div class="d-flex justify-content-between align-items-center">
        <small class="text-danger" *ngIf="form.get('description')?.touched && form.get('description')?.hasError('maxlength')">
          Máximo de 255 caracteres
        </small>

        <small
          class="ms-auto"
          [class.text-danger]="descriptionLength > maxTextLen"
          [class.text-muted]="descriptionLength <= maxTextLen"
        >
          {{ descriptionLength }}/{{ maxTextLen }}
        </small>
      </div>
    </div>

    <div class="col-12" *ngIf="group">
      <div class="group-form__status">
        <input
          class="group-form__status-input"
          type="checkbox"
          id="groupIsActive"
          formControlName="isActive"
        />

        <div class="group-form__status-switch" role="group" aria-label="Status do grupo">
          <button
            type="button"
            class="group-form__status-option"
            [class.group-form__status-option--selected]="form.get('isActive')?.value === true"
            [class.group-form__status-option--active]="form.get('isActive')?.value === true"
            (click)="setActiveStatus(true)"
            (keydown.enter)="$event.preventDefault(); setActiveStatus(true)"
            (keydown.space)="$event.preventDefault(); setActiveStatus(true)"
          >
            <span class="group-form__status-dot" aria-hidden="true"></span>
            <span class="group-form__status-text">ATIVO</span>
          </button>

          <button
            type="button"
            class="group-form__status-option"
            [class.group-form__status-option--selected]="form.get('isActive')?.value === false"
            [class.group-form__status-option--inactive]="form.get('isActive')?.value === false"
            (click)="setActiveStatus(false)"
            (keydown.enter)="$event.preventDefault(); setActiveStatus(false)"
            (keydown.space)="$event.preventDefault(); setActiveStatus(false)"
          >
            <span class="group-form__status-dot" aria-hidden="true"></span>
            <span class="group-form__status-text">INATIVO</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</form>
