<div class="modal-header">
  <h5 class="modal-title">{{ activityTypeId ? 'Editar Tipo de Atividade' : 'Novo Tipo de Atividade' }}</h5>

  <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="row g-3">
      <div class="col-12">
        <app-input-group
          label="Nome"
          id="activityTypeName"
          type="text"
          placeholder="Ex: Prova"
          formControlName="name"
          [disabled]="isSubmitting || isLoading"
        ></app-input-group>
      </div>

      <div class="col-12">
        <app-input-group
          label="Descrição"
          id="activityTypeDescription"
          [textarea]="true"
          [rows]="4"
          placeholder="Descreva o tipo (opcional)"
          formControlName="description"
          [disabled]="isSubmitting || isLoading"
        ></app-input-group>
      </div>
    </div>

    <div class="alert alert-danger mt-3" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="modal-actions mt-4" appEqualizeModalButtons>
      <app-submit-button
        type="button"
        label="Cancelar"
        icon=""
        [disabled]="isSubmitting || isLoading"
        (click)="close()"
      ></app-submit-button>

      <app-submit-button
        type="button"
        [label]="activityTypeId ? 'Salvar' : 'Criar'"
        icon=""
        [disabled]="isSubmitting || isLoading || form.invalid"
        (click)="submit()"
      ></app-submit-button>
    </div>
  </form>
</div>
