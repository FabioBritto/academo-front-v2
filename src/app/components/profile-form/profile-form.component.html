<div *ngIf="validationMessage" class="alert alert-warning" role="alert">
  {{ validationMessage }}
</div>

<div *ngIf="errorMessage" class="alert alert-danger" role="alert">
  {{ errorMessage }}
</div>

<form [formGroup]="form" (ngSubmit)="$event.preventDefault(); submit()">
  <div class="row g-4">
    <div class="col-12">
      <app-input-group
        label="Nome completo"
        icon="bi bi-person-fill"
        placeholder="Seu nome (opcional)"
        [invalid]="!!(form.get('fullName')?.touched && form.get('fullName')?.invalid)"
        formControlName="fullName"
      ></app-input-group>

      <div class="d-flex justify-content-between align-items-center">
        <small class="text-danger" *ngIf="form.get('fullName')?.touched && form.get('fullName')?.hasError('maxlength')">
          Máximo de 255 caracteres
        </small>

        <small
          class="ms-auto"
          [class.text-danger]="fullNameLength > maxTextLen"
          [class.text-muted]="fullNameLength <= maxTextLen"
        >
          {{ fullNameLength }}/{{ maxTextLen }}
        </small>
      </div>
    </div>

    <div class="col-12">
      <app-input-group
        label="Data de nascimento"
        icon="bi bi-calendar-event"
        id="birthDate"
        type="text"
        inputMode="numeric"
        placeholder="00/00/0000"
        mask="00/00/0000"
        [dropSpecialCharacters]="false"
        [maxLength]="10"
        [invalid]="!!(form.get('birthDate')?.touched && form.get('birthDate')?.invalid)"
        formControlName="birthDate"
        (blurred)="onBirthDateBlur()"
      ></app-input-group>

      <small class="text-danger" *ngIf="form.get('birthDate')?.touched && form.get('birthDate')?.hasError('invalidDate')">
        Data inválida
      </small>
    </div>

    <div class="col-12">
      <label class="form-label profile-form__label">Gênero</label>

      <div class="d-flex flex-wrap gap-3">
        <label class="form-check">
          <input class="form-check-input" type="radio" value="M" formControlName="gender" />
          <span class="form-check-label">Masculino</span>
        </label>

        <label class="form-check">
          <input class="form-check-input" type="radio" value="F" formControlName="gender" />
          <span class="form-check-label">Feminino</span>
        </label>
      </div>
    </div>
  </div>
</form>
