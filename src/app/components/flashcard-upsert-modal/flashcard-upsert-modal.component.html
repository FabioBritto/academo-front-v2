<div class="modal-header">
  <h5 class="modal-title">{{ title }}</h5>

  <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
</div>

<div class="modal-body">
  <div class="flashcard-upsert-modal">
    <app-flashcard-form
      [subjectId]="subjectId"
      [flashcard]="flashcard"
      (saved)="onSaved($event)"
    ></app-flashcard-form>

    <div class="modal-actions mt-4">
      <app-submit-button
        type="button"
        label="Cancelar"
        icon=""
        [disabled]="isSubmitting"
        (click)="close()"
      ></app-submit-button>

      <app-submit-button
        type="button"
        [label]="flashcard ? 'Salvar Alterações' : 'Criar Flashcard'"
        icon=""
        [disabled]="isSubmitting"
        (click)="onSaveClick()"
      ></app-submit-button>
    </div>
  </div>
</div>
