<div *ngIf="validationMessage" class="alert alert-warning" role="alert">
  {{ validationMessage }}
</div>

<div *ngIf="errorMessage" class="alert alert-danger" role="alert">
  {{ errorMessage }}
</div>

<form [formGroup]="form" (ngSubmit)="$event.preventDefault(); submit()">
  <div class="row g-4">
    <div class="col-12">
      <app-input-group
        label="Nome"
        icon="bi bi-book"
        placeholder="Nome da matéria"
        [invalid]="!!(form.get('name')?.touched && form.get('name')?.invalid)"
        formControlName="name"
      ></app-input-group>

      <div class="d-flex justify-content-between align-items-center">
        <small class="text-danger" *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')">
          O nome é obrigatório
        </small>

        <small class="text-danger" *ngIf="form.get('name')?.touched && form.get('name')?.hasError('maxlength')">
          Máximo de 255 caracteres
        </small>

        <small
          class="ms-auto"
          [class.text-danger]="nameLength > maxTextLen"
          [class.text-muted]="nameLength <= maxTextLen"
        >
          {{ nameLength }}/{{ maxTextLen }}
        </small>
      </div>
    </div>

    <div class="col-12">
      <app-input-group
        label="Descrição"
        icon="bi bi-card-text"
        placeholder="Descrição da matéria (opcional)"
        [textarea]="true"
        [rows]="6"
        [invalid]="!!(form.get('description')?.touched && form.get('description')?.invalid)"
        formControlName="description"
      ></app-input-group>

      <div class="d-flex justify-content-between align-items-center">
        <small class="text-danger" *ngIf="form.get('description')?.touched && form.get('description')?.hasError('maxlength')">
          Máximo de 255 caracteres
        </small>

        <small
          class="ms-auto"
          [class.text-danger]="descriptionLength > maxTextLen"
          [class.text-muted]="descriptionLength <= maxTextLen"
        >
          {{ descriptionLength }}/{{ maxTextLen }}
        </small>
      </div>
    </div>

    <div class="col-12" *ngIf="subject">
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <app-input-group
            label="Nota mínima"
            id="subjectPassingGrade"
            type="number"
            inputMode="decimal"
            pattern="[0-9]*[.,]?[0-9]?"
            step="0.1"
            min="0.1"
            max="10"
            placeholder="0"
            [invalid]="!!(form.get('passingGrade')?.touched && form.get('passingGrade')?.invalid)"
            formControlName="passingGrade"
            [disabled]="isSubmitting"
          ></app-input-group>

          <small
            class="text-danger"
            *ngIf="form.get('passingGrade')?.touched && (form.get('passingGrade')?.hasError('required') || form.get('passingGrade')?.hasError('min') || form.get('passingGrade')?.hasError('max'))"
          >
            Informe uma nota maior que 0 e menor ou igual a 10
          </small>
        </div>

        <div class="col-12 col-md-6">
          <div class="subject-form__advanced-field">
            <label class="subject-form__label" for="subjectCalculationType">
              Tipo de cálculo
              <span *ngIf="isControlRequired('calculationType')" class="text-danger">*</span>
            </label>
            <app-calculation-type-dropdown
              [value]="form.get('calculationType')?.value"
              [disabled]="isSubmitting"
              (valueChange)="onCalculationTypeChange($event)"
            ></app-calculation-type-dropdown>
          </div>

          <small class="text-danger" *ngIf="form.get('calculationType')?.touched && form.get('calculationType')?.hasError('required')">
            Selecione um tipo de cálculo
          </small>
        </div>

        <div class="col-12">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="subjectIsActive" formControlName="isActive" />
            <label class="form-check-label" for="subjectIsActive">Ativo</label>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
