<section class="subject-files-list" aria-label="Arquivos">
  <header class="subject-files-list__header">
    <h5 class="subject-files-list__title">Lista de arquivos</h5>

    <app-submit-button
      label="Fazer Upload"
      icon="bi bi-upload"
      type="button"
      (click)="openUploadModal()"
    ></app-submit-button>
  </header>

  <div class="subject-files-list__body">
    <ng-container *ngIf="hasItems; else emptyState">
      <div class="subject-files-list__placeholder">Conteúdo de arquivos (placeholder)</div>
    </ng-container>

    <ng-template #emptyState>
      <p class="subject-files-list__empty">{{ emptyMessage }}</p>
    </ng-template>
  </div>
</section>
