<section class="subject-files-list" aria-label="Arquivos">
  <header class="subject-files-list__header">
    <h5 class="subject-files-list__title">Lista de arquivos</h5>

    <app-submit-button
      label="Fazer Upload"
      icon="bi bi-upload"
      type="button"
      (click)="openUploadModal()"
    ></app-submit-button>
  </header>

  <div class="subject-files-list__body">
    <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
      {{ errorMessage }}
    </div>

    <div *ngIf="isLoading" class="subject-files-list__loading">Carregando...</div>

    <ng-container *ngIf="!isLoading">
      <ng-container *ngIf="hasItems; else emptyState">
        <div class="subject-files-list__items">
          <article class="subject-files-list__item" *ngFor="let f of files">
            <div class="subject-files-list__item-main">
              <div class="subject-files-list__item-name">{{ f.fileName }}</div>
              <div class="subject-files-list__item-meta">{{ formatBytes(f.size) }} • {{ f.fileType }}</div>
            </div>

            <div class="subject-files-list__item-actions">
              <app-submit-button
                label="Download"
                icon="bi bi-download"
                type="button"
                [disabled]="isLoading"
                (click)="download(f)"
              ></app-submit-button>

              <app-delete-button
                label="Excluir"
                icon="bi bi-trash-fill"
                [disabled]="isLoading"
                [isSubmitting]="isLoading"
                confirmTitle="Excluir arquivo"
                [confirmMessage]="'Tem certeza que deseja excluir o arquivo ' + f.fileName + '?'"
                (confirmed)="delete(f)"
              ></app-delete-button>
            </div>
          </article>
        </div>

        <app-pagination-controls
          *ngIf="totalPages > 1"
          [page]="page"
          [totalPages]="totalPages"
          [disabled]="isLoading"
          (pageChange)="onPageChange($event)"
        ></app-pagination-controls>
      </ng-container>
    </ng-container>

    <ng-template #emptyState>
      <p class="subject-files-list__empty">{{ emptyMessage }}</p>
    </ng-template>
  </div>
</section>
